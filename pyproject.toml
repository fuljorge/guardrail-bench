[project]
name = "guardbench"
version = "0.1.0"
description = "Reproducible benchmark of open-weight prompt-injection and toxicity detectors for customer-service agents in Brazilian Portuguese, with a deterministic attack/legitimate suite and per-stage pipeline rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Fulvio Jorge da Silva" }]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
guardbench = "guardbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Suite phrases and platform patterns: long Portuguese literals and look-alike letters on purpose.
"src/guardbench/suite.py" = ["E501", "RUF001"]
"src/guardbench/patterns.py" = ["E501", "RUF001"]
"src/guardbench/normalize.py" = ["E501", "RUF001"]
# Markdown table rows read better on one line.
"src/guardbench/report.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
